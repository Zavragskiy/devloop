name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poetry
        run: python -m pip install --upgrade pip "poetry>=2,<3"
      - name: Install project
        run: poetry install --no-interaction
      - name: Lint
        run: poetry run ruff check src tests examples
      - name: Format
        run: poetry run ruff format --check src tests examples
      - name: Types
        run: poetry run mypy src examples/runner/run_tests.py
      - name: Unit tests
        run: poetry run pytest

  build:
    name: build wheel
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: python -m pip install --upgrade pip "poetry>=2,<3"
      - name: Build distributions
        run: poetry build
      - name: Smoke-install the wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/devloop --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
